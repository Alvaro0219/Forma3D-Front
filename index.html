<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E1116" />
    <title>FORMA — Impresiones 3D</title>
    <meta name="description" content="Impresión 3D personalizada: piezas hechas a tu medida para regalos, decoración y momentos especiales. Elegís, confirmás por WhatsApp y coordinamos la entrega." />

    <!-- Favicon: recorte circular del isotipo (ver public/favicon.png).
         Es un archivo aparte de forma-logo.png porque el favicon lo renderiza
         el navegador/SO directamente — el redondeo tiene que venir ya aplicado
         en la imagen, un border-radius de CSS no le hace nada. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Open Graph: como se ve el link al compartirlo (WhatsApp, redes).
         og:image va con URL absoluta: muchos bots de vista previa (WhatsApp
         incluido) no resuelven bien una ruta relativa. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FORMA — Impresiones 3D" />
    <meta property="og:title" content="FORMA — Impresiones 3D" />
    <meta property="og:description" content="Impresión 3D personalizada: piezas hechas a tu medida para regalos, decoración y momentos especiales." />
    <meta property="og:image" content="https://formaimpresiones.com/forma-logo.png" />
    <meta property="og:url" content="https://formaimpresiones.com/tienda" />

    <!-- Tipografía: una sola familia (Inter). La jerarquía se hace con
         tamaño/peso/color, no cambiando de fuente. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Aplicar tema antes del primer render (evita flash). Default: oscuro. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('i3d_theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
          document.querySelector('meta[name=theme-color]').setAttribute('content', theme === 'light' ? '#F6F7F9' : '#0E1116');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
